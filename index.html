<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title>
</head>

<body>
    <main>
        <div class="title-div">
            <h1>Gerenciador de Tarefas</h1>
        </div>

        <section class="user-stats">
            <div class="user-stats-header">
                <div class="user-info">
                    <h2 class="username">User</h2>
                    <img src="./assets/img/pencil.svg" alt="Image of pencil icon">
                </div>

                <img src="./assets/img/sun.svg" alt="Image of a sun icon">
            </div>
            <div class="user-progress">
                <span class="level">Level 1</span>
                <div class="xp-amount-div">
                    <span class="current-xp">0</span>
                    /
                    <span class="needed-xp">100</span>
                </div>
                <div class="progress-bar"></div>
            </div>
        </section>

        <form>

        </form>
            <input type="text" name="task-creation-input" id="task-creation-input" placeholder="Digite sua tarefa aqui">
            <input type="submit" class="create-task-button" value="Criar">

             
        <ul>

        </ul>
    </main>
</body>

</html>
