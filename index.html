<!doctype html>
<html lang="pt-br" class="">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title></title>
    <link rel="stylesheet" href="./src/css/style.css" />
  </head>

  <body>
    <main>
      <h1 class="title">Gerenciador de Tarefas</h1>

      <section class="user-stats">
        <div class="user-stats-header">
          <div class="user-info">
            <h2 class="username">User</h2>
            <button class="icon">
              <img
                src="./assets/img/pencil-dark.svg"
                alt="Pencil Icon | Edit Username"
                class="pencil-icon"
              />
            </button>
          </div>

          <button class="icon" id="toggle-theme-btn">
            <img
              src="./assets/img/sun.svg"
              class="theme-icon"
              alt="Sun Icon | Toggle Theme"
            />
          </button>
        </div>
        <div class="user-progress">
          <span class="level">Level 1</span>

          <div class="xp-container">
            <span class="xp-label">XP Progress</span>
            <div class="xp-amount-div">
              <span class="current-xp">0</span>
              /
              <span class="needed-xp">100</span>
            </div>
          </div>
        </div>

        <div class="progress-bar-container">
          <div class="progress-bar"></div>
        </div>
      </section>

      <section class="task-creation">
        <form>
          <label for="task-creation-input" class="task-creation-label">
            <input
              type="text"
              name="task-creation-input"
              id="task-creation-input"
              placeholder="O que precisa ser feito?"
              class="task-creation-input"
            />
            <input type="submit" class="create-task-button" id="create-task-button" value="Adicionar" />
          </label>
        </form>
      </section>

      <h2 class="subtitle">Tarefas</h2>

      <section class="task-section">
        <ul class="task-list" id="task-list">
          <li class="task">
            <label class="task-header">
              <input
                type="checkbox"
                name="task-markoff"
                class="task-checkbox__input"
              />
              <span class="task-checkbox__box" aria-hidden="true"></span>
              <span class="task-title">Tarefa teste</span>
            </label>
            <button class="trash-icon">
              <img
                src="./assets/img/trash-dark.svg"
                alt="Trash Icon | Delete Task"
                class="trash-icon-img"
              />
            </button>
          </li>
          <li class="task">
            <label class="task-header">
              <input
                type="checkbox"
                name="task-markoff"
                class="task-checkbox__input"
              />
              <span class="task-checkbox__box" aria-hidden="true"></span>
              <span>Tarefa teste 2</span>
            </label>
            <button class="trash-icon">
              <img
                src="./assets/img/trash-dark.svg"
                alt="Trash Icon | Delete Task"
                class="trash-icon-img"
              />
            </button>
          </li>
          <li class="task">
            <label class="task-header">
              <input
                type="checkbox"
                name="task-markoff"
                class="task-checkbox__input"
              />
              <span class="task-checkbox__box" aria-hidden="true"></span>
              <span>Tarefa teste 2</span>
            </label>
            <button class="trash-icon">
              <img
                src="./assets/img/trash-dark.svg"
                alt="Trash Icon | Delete Task"
                class="trash-icon-img"
              />
            </button>
          </li>
        </ul>
      </section>
    </main>

    <script type="module" src="./src/js/main.js"></script>
  </body>
</html>
